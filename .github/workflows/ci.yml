name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core + install dev deps
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          pip install --find-links dist "infy[dev]"
      - name: Ruff (lint)
        run: ruff check infy tests examples
      - name: Ruff (format)
        run: ruff format --check infy tests examples
      - name: Mypy (strict)
        run: mypy infy

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core (release) + install dev deps
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          pip install --find-links dist "infy[dev]"
      - name: Pytest
        run: pytest -q
