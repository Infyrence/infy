name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core + install dev deps
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          pip install --find-links dist "infy[dev]"
      - name: Ruff (lint)
        run: ruff check infy tests examples
      - name: Ruff (format)
        run: ruff format --check infy tests examples
      - name: Mypy (strict)
        run: mypy infy

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      # `maturin develop`, not `build` + `pip install`. The repo ships infy_core/__init__.py
      # (it re-exports the compiled submodule) but not the binary, and pytest puts the repo
      # root on sys.path — so the source tree shadows the installed wheel and
      # `infy_core.infy_core` is missing. develop puts the extension in the tree, which is
      # also what CONTRIBUTING tells contributors to run.
      - name: Build core (release) + install dev deps
        shell: bash
        run: |
          python -m venv .venv
          VENV_BIN=$([ -d .venv/bin ] && echo .venv/bin || echo .venv/Scripts)
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          "$VENV_BIN/python" -m pip install --upgrade pip maturin
          VIRTUAL_ENV="$PWD/.venv" "$VENV_BIN/python" -m maturin develop --release --extras dev
      - name: Pytest
        shell: bash
        run: |
          "$VENV_BIN/python" -m pytest -q
