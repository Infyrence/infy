name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        infy keeps a deliberately small surface area. New top-level abstractions need a motivating
        use case — please make the case here before opening a large PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that infy makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API or behavior look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
