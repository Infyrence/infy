[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "infy"
version = "0.2.0"
description = "A zero-dependency, SIMD-accelerated LLM framework built for speed, safety, and scale."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Infyrence" }]
keywords = ["llm", "agents", "framework", "governance", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
ollama = ["ollama>=0.3.0"]
gemini = ["google-genai>=1.0.0"]
pydantic = ["pydantic>=2.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0", "ollama>=0.3.0", "google-genai>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Linters are pinned to a minor series on purpose. Unpinned, CI silently installs a
    # newer ruff than the contributor has, and a formatting rule that did not exist locally
    # fails the build on green code. Bump these deliberately, not by surprise.
    "ruff>=0.15.18,<0.16",
    "mypy>=2.1,<3",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://infyrence.com"
Repository = "https://github.com/Infyrence/infy"
Issues = "https://github.com/Infyrence/infy/issues"
Changelog = "https://github.com/Infyrence/infy/blob/main/CHANGELOG.md"

[tool.maturin]
# Mixed Python/Rust project: the pure-Python package lives in ./infy and the
# compiled SIMD core ships as a top-level `infy_core` extension module. Every
# module that uses it falls back to pure Python when the extension is absent.
manifest-path = "core-rust/Cargo.toml"
python-source = "."
module-name = "infy_core.infy_core"
# Ship both the pure-Python `infy` package and the compiled `infy_core` module.
include = ["infy/**/*.py", "infy/py.typed"]
exclude = ["tests/**", "examples/**", "core-rust/target/**", "**/__pycache__/**"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Newer ruff formats Python code blocks inside Markdown by default. The module READMEs use
# hand-aligned trailing comments that the formatter normalises away, and CI passes `infy` as
# a directory, so the docs get swept in and the build fails on prose. Exclude them:
# `ruff format` is for source, and this keeps local and CI identical across ruff versions.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true

# Optional provider SDKs and framework integrations are imported lazily and aren't installed in
# the base environment; their objects are inherently dynamic at the integration boundary.
[[tool.mypy.overrides]]
module = [
    "openai.*", "anthropic.*", "ollama.*", "google.*",
    "smolagents", "smolagents.*", "openhands.*", "langchain_core.*", "langchain.*",
]
ignore_missing_imports = true

# Whether a `type: ignore` in a provider is "unused" depends on whether that provider's SDK
# happens to be installed: with the SDK absent the call site is Any and the ignore is dead,
# with it present the ignore is load-bearing. Under `strict` that makes the build fail in one
# environment and pass in the other for identical code, so the check is switched off here and
# only here. Everything outside the provider boundary keeps it.
[[tool.mypy.overrides]]
module = ["infy.providers.*"]
warn_unused_ignores = false
