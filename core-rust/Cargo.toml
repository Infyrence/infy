[package]
name = "infy_core"
version = "0.2.0"
edition = "2021"
description = "SIMD-accelerated hot paths (JSON parsing, cosine similarity, tokenisation) for the infy LLM framework."
license = "Apache-2.0"
repository = "https://github.com/Infyrence/infy"
# Not published to crates.io: this crate is vendored into the infy wheel.
publish = false

[lib]
name = "infy_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: build a single stable-ABI wheel that works on CPython 3.10+,
# so CI ships one wheel per platform instead of one per Python version.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
